version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: ceara_queimadas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: queimadas
      POSTGRES_USER: ceara
      POSTGRES_PASSWORD: ceara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceara -d queimadas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (cache e filas Celery)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ceara_queimadas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ceara_queimadas_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ceara:ceara@db:5432/queimadas
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # Worker Celery (coleta periódica)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ceara_queimadas_worker
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ceara:ceara@db:5432/queimadas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  # ---------------------------------------------------------------------------
  # Frontend React (desenvolvimento)
  # ---------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: ceara_queimadas_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
